<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなただけのメッセージ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #ffc3a0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
  }
  h1 {
    font-size: 20px;
    color: #d1477a;
    margin-bottom: 8px;
  }
  p.sub {
    font-size: 13px;
    color: #999;
    margin-bottom: 24px;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #f4c6d0;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: #ee9ca7;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ee9ca7, #ffc3a0);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #result {
    margin-top: 24px;
    display: none;
  }
  #result.show {
    display: block;
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message-box {
    background: linear-gradient(135deg, #fff5f6, #fff0e6);
    border-radius: 16px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.7;
    color: #5a3d42;
    margin-bottom: 20px;
    border: 1px solid #f4c6d0;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 14px;
    border: 2px solid #f4c6d0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    resize: vertical;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea:focus { border-color: #ee9ca7; }

  #thanks {
    display: none;
    font-size: 16px;
    color: #d1477a;
    font-weight: bold;
    padding: 20px 0;
  }
  #thanks.show { display: block; animation: fadeUp 0.6s ease; }

  #error {
    display: none;
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <div id="step1">
    <h1>✨ あなただけのメッセージ ✨</h1>
    <p class="sub">お名前を入力してボタンを押してみてね</p>
    <input type="text" id="nameInput" placeholder="お名前(ニックネームでもOK)" maxlength="20">
    <button id="generateBtn" onclick="generateMessage()">メッセージを作る</button>
  </div>

  <div id="result">
    <div class="message-box" id="generatedMessage"></div>
    <p class="sub" style="margin-bottom:10px;">お返事をひとことどうぞ 💬</p>
    <textarea id="replyInput" placeholder="思ったことを気軽にどうぞ〜"></textarea>
    <button id="submitBtn" onclick="submitMessage()">送信する</button>
    <div id="error"></div>
  </div>

  <div id="thanks">
    届きました!ありがとう 🌸
  </div>
</div>

<script>
  // ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxnMdTPOJ-KOCwJdXAaZitMyZJudLF04rZ_HLolhF0xaY9puEwbLRjfm2Inm452Ta5lEQ/exec";

  const templates = [
    "{name}さんと話してると、時間があっという間だなっていつも思います。",
    "{name}さんの笑ったときの感じ、なんかいいなってずっと思ってました。",
    "実は{name}さんと喋ってる時間、地味に一番好きです。",
    "{name}さんって話しやすくて、気づいたらこっちも素になってる気がします。",
    "{name}さんとまたゆっくり喋りたいなってずっと思ってました。"
  ];

  let currentMessage = "";

  function generateMessage() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) {
      alert("お名前を入力してください");
      return;
    }
    const template = templates[Math.floor(Math.random() * templates.length)];
    currentMessage = template.replace("{name}", name);

    document.getElementById("generatedMessage").textContent = currentMessage;
    document.getElementById("result").classList.add("show");
    document.getElementById("generateBtn").disabled = true;
  }

  async function submitMessage() {
    const name = document.getElementById("nameInput").value.trim();
    const reply = document.getElementById("replyInput").value.trim();
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    errorEl.style.display = "none";

    if (ENDPOINT_URL === "PASTE_YOUR_GAS_URL_HERE") {
      errorEl.textContent = "送信先URLが未設定です(作成者向けの表示です)";
      errorEl.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    try {
      await fetch(ENDPOINT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          name: name,
          generatedMessage: currentMessage,
          reply: reply
        })
      });

      document.getElementById("step1").style.display = "none";
      document.getElementById("result").style.display = "none";
      document.getElementById("thanks").classList.add("show");
    } catch (err) {
      errorEl.textContent = "送信に失敗しました。通信環境を確認してもう一度お試しください。";
      errorEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "送信する";
    }
  }
</script>

</body>
</html>
