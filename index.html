<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メッセージが届いています</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #ffc3a0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
    position: relative;
    overflow: visible;
  }

  /* ---- 封筒画面 ---- */
  #envelopeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .envelope-stage {
    width: 200px;
    height: 160px;
    margin: 14px auto 28px;
    position: relative;
    perspective: 700px;
  }
  .envelope-svg {
    position: absolute;
    bottom: 0; left: 0;
    width: 200px;
    height: 140px;
    z-index: 2;
    filter: drop-shadow(0 14px 18px rgba(180,90,100,0.25));
  }
  .envelope-flap-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 200px;
    height: 90px;
    z-index: 3;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.45,1.6,.55,1);
  }
  .envelope-stage.idle .envelope-flap-wrap {
    animation: sway 2.3s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1deg); }
  }
  .envelope-flap-wrap.open {
    transform: rotateX(178deg);
    animation: none;
  }
  .envelope-seal {
    position: absolute;
    top: 58px; left: 88px;
    width: 26px; height: 26px;
    z-index: 4;
    animation: pulse 1.6s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(150,40,60,0.35));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .letter-paper {
    position: absolute;
    bottom: 14px;
    left: 28px;
    width: 144px;
    height: 96px;
    z-index: 1;
    opacity: 0;
    transform: translateY(0) scale(0.9);
  }
  .letter-paper.pop {
    animation: letterPop 0.75s ease forwards 0.28s;
  }
  @keyframes letterPop {
    0% { opacity: 0; transform: translateY(6px) scale(0.85) rotate(0deg); }
    60% { opacity: 1; transform: translateY(-78px) scale(1.02) rotate(-2deg); }
    100% { opacity: 1; transform: translateY(-70px) scale(1) rotate(-1.5deg); }
  }

  h1 { font-size: 19px; color: #d1477a; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: #999; margin-bottom: 4px; }
  .tap-hint {
    font-size: 12px;
    color: #ee9ca7;
    margin-top: 18px;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .envelope-stage.shrink {
    animation: shrinkOut 0.4s ease forwards 0.75s;
  }
  @keyframes shrinkOut {
    to { opacity: 0; transform: scale(0.85); }
  }

  /* ---- 紙吹雪 ---- */
  .confetti-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
    overflow: visible;
  }
  .confetti-piece {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 18px;
    opacity: 0;
    will-change: transform, opacity;
    animation: burst 0.9s ease-out forwards;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    100% {
      opacity: 0;
      transform:
        translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
        scale(1.1) rotate(var(--rot));
    }
  }

  /* ---- メッセージ画面 ---- */
  #messageScreen { display: none; }
  #messageScreen.show { display: block; animation: fadeUp 0.6s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .message-box {
    background: linear-gradient(135deg, #fff5f6, #fff0e6);
    border-radius: 16px;
    padding: 22px;
    font-size: 16px;
    line-height: 1.8;
    color: #5a3d42;
    margin-bottom: 20px;
    border: 1px solid #f4c6d0;
    text-align: left;
    box-shadow: 0 8px 20px rgba(238,156,167,0.25);
    white-space: pre-line;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 14px;
    border: 2px solid #f4c6d0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    resize: vertical;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea:focus { border-color: #ee9ca7; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ee9ca7, #ffc3a0);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #thanks { display: none; font-size: 16px; color: #d1477a; font-weight: bold; padding: 20px 0; }
  #thanks.show { display: block; animation: fadeUp 0.6s ease; }

  #error { display: none; color: #c0392b; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>

<div class="card" id="cardEl">

  <div id="envelopeScreen" onclick="openLetter()">
    <h1>💌 メッセージが届いています</h1>
    <p class="sub">タップして開けてね</p>
    <div class="envelope-stage idle" id="envelopeStage">

      <!-- 便箋(封筒の中から出てくる紙) -->
      <svg class="letter-paper" id="letterPaper" viewBox="0 0 144 96">
        <rect x="1" y="1" width="142" height="94" rx="5" fill="#fffdf7" stroke="#f1d9c8" stroke-width="1"/>
        <line x1="18" y1="24" x2="126" y2="24" stroke="#f3c8d2" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="40" x2="110" y2="40" stroke="#f6dde3" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="56" x2="118" y2="56" stroke="#f6dde3" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="72" x2="88" y2="72" stroke="#f6dde3" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <!-- 封筒本体(袋+底の折り返し) -->
      <svg class="envelope-svg" viewBox="0 0 200 140" preserveAspectRatio="none">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff3ec"/>
            <stop offset="100%" stop-color="#ffe2e8"/>
          </linearGradient>
          <linearGradient id="pocketGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd9e0"/>
            <stop offset="100%" stop-color="#ffc9d6"/>
          </linearGradient>
        </defs>
        <rect x="0" y="10" width="200" height="130" rx="12" fill="url(#bodyGrad)"/>
        <path d="M0 22 L100 92 L200 22 L200 20 Q200 10 190 10 L10 10 Q0 10 0 20 Z" fill="url(#pocketGrad)" opacity="0.9"/>
        <rect x="0" y="10" width="200" height="130" rx="12" fill="none" stroke="#f6b9c6" stroke-width="1.5" opacity="0.6"/>
      </svg>

      <!-- 封筒のフタ(開閉するパーツ) -->
      <div class="envelope-flap-wrap" id="envelopeFlap">
        <svg viewBox="0 0 200 90" preserveAspectRatio="none" style="width:100%; height:100%;">
          <defs>
            <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5aab8"/>
              <stop offset="100%" stop-color="#ee93a4"/>
            </linearGradient>
          </defs>
          <path d="M10 10 Q0 10 0 20 L100 88 L200 20 Q200 10 190 10 Z" fill="url(#flapGrad)"/>
        </svg>
      </div>

      <!-- 封蝋シール -->
      <svg class="envelope-seal" viewBox="0 0 26 26">
        <circle cx="13" cy="13" r="12" fill="#e8637c"/>
        <circle cx="13" cy="13" r="12" fill="none" stroke="#c94c66" stroke-width="1"/>
        <path d="M13 8.5c1.6-2.2 5.4-1 5.4 1.7c0 3-3.6 5-5.4 6.6c-1.8-1.6-5.4-3.6-5.4-6.6c0-2.7 3.8-3.9 5.4-1.7z" fill="#fff" opacity="0.92"/>
      </svg>

      <div class="confetti-layer" id="confettiLayer"></div>
    </div>
    <div class="tap-hint">タップして開封する ▶</div>
  </div>

  <div id="messageScreen">
    <div class="message-box" id="fixedMessage"></div>
    <p class="sub" style="margin-bottom:10px; text-align:left;">お返事をひとことどうぞ 💬</p>
    <textarea id="replyInput" placeholder="思ったことを気軽にどうぞ〜"></textarea>
    <button id="submitBtn" onclick="submitMessage()">送信する</button>
    <div id="error"></div>
  </div>

  <div id="thanks">
    届きました!ありがとう 🌸
  </div>

</div>

<script>
  // ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxvPJWBtAntcHEUeDX_eQuzBEZLO-AF5m_-Qn90GOH-wnGL1ztvCyXAifNFGypkcCqtlg/exec";

  // 固定メッセージ(ここを自由に書き換えてください)
  const FIXED_MESSAGE = `今日も楽しかったよ、ありがとう！
						また一緒にデートしようね😊`;

  let opened = false;

  function spawnConfetti() {
    const layer = document.getElementById("confettiLayer");
    const emojis = ["💖","✨","💕","🌸","⭐️","💗"];
    const count = 16;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "confetti-piece";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 90;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      const rot = (Math.random() * 360 - 180) + "deg";
      el.style.setProperty("--dx", dx + "px");
      el.style.setProperty("--dy", dy + "px");
      el.style.setProperty("--rot", rot);
      el.style.animationDelay = (Math.random() * 0.12) + "s";
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }
  }

  function openLetter() {
    if (opened) return;
    opened = true;

    if (navigator.vibrate) {
      navigator.vibrate([15, 40, 15]);
    }

    const stage = document.getElementById("envelopeStage");
    const flap = document.getElementById("envelopeFlap");
    const paper = document.getElementById("letterPaper");

    stage.classList.remove("idle");
    flap.classList.add("open");
    paper.classList.add("pop");
    spawnConfetti();
    stage.classList.add("shrink");

    document.getElementById("fixedMessage").textContent = FIXED_MESSAGE;

    setTimeout(() => {
      document.getElementById("envelopeScreen").style.display = "none";
      document.getElementById("messageScreen").classList.add("show");
    }, 950);
  }

  async function submitMessage() {
    const reply = document.getElementById("replyInput").value.trim();
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    errorEl.style.display = "none";

    if (!reply) {
      errorEl.textContent = "返信メッセージを入力してください";
      errorEl.style.display = "block";
      return;
    }

    if (ENDPOINT_URL.indexOf("PASTE_YOUR_GAS_URL_HERE") !== -1) {
      errorEl.textContent = "送信先URLが未設定です(作成者向けの表示です)";
      errorEl.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    try {
      await fetch(ENDPOINT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ reply: reply })
      });

      document.getElementById("messageScreen").classList.remove("show");
      document.getElementById("messageScreen").style.display = "none";
      document.getElementById("thanks").classList.add("show");
    } catch (err) {
      errorEl.textContent = "送信に失敗しました。通信環境を確認してもう一度お試しください。";
      errorEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "送信する";
    }
  }
</script>

</body>
</html>
